services:
  - type: web
    name: ua-cv-reviewer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      # Matches the version this project is developed and tested on.
      - key: PYTHON_VERSION
        value: 3.14.10
      # WEBHOOK_URL is deliberately absent: config.py falls back to the
      # RENDER_EXTERNAL_URL that Render injects, so there is nothing to fill in.
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
